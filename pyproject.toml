[project]
name = "mercado-inmobiliario-nds"
version = "0.1.0"
description = "Análisis del mercado inmobiliario en Norte de Santander (Pamplona como caso de estudio)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "requests>=2.31.0",
    "scipy>=1.12.0",
    "statsmodels>=0.14.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
